spring:
  application:
    name: coworking-booking-api

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/coworking_db
    username: nurlybeknurmukhan
    password: ""
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Подгружает ленивые связи пачками вместо N+1 при маппинге страниц.
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # В проде задаётся через JWT_SECRET; значение по умолчанию — только для локальной разработки.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
  booking:
    min-duration-minutes: 30
    max-duration-hours: 12
    open-hour: 8
    close-hour: 22
  # Первый администратор создаётся при старте, только если задан ADMIN_PASSWORD.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@coworking.local}
    password: ${ADMIN_PASSWORD:}
    full-name: Administrator

logging:
  level:
    root: INFO
    kz.nurlybek: DEBUG
    AUDIT: INFO